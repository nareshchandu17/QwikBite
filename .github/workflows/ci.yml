name: QwikBite Continuous Integration

# When should these checks run?
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x] # Testing across multiple versions ensures better compatibility

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Package caching for faster runs

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps # 'npm ci' is faster and more reliable than 'npm install' in CI environments

      - name: Run ESLint Check
        run: npm run lint
        # If linting fails, the workflow stops here and prevents a broken deployment.

      - name: Run Vitest Unit Tests
        run: npm run test
        # Stops deployment if business logic tests (Slot math, Auth helper) fail.

      - name: Verify Build Engine
        run: npm run build
        env:
          # Environment variables required for the build process must be provided here
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
